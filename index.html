<style>
/* Layout : une colonne d'appli mobile. Concept : le fichier de ton entourage —
   fiches Bristol teintées, encre bleu Bic, marge rouge, photos qui se développent comme des tirages. */
:root {
  --paper: #F3F5F8; --sheet: #FFFFFF; --sheet-2: #EEF1F6; --desk: #E4E8EF;
  --ink: #141821; --ink-2: #4F5868; --ink-3: #7F8898;
  --rule: #DFE4EC; --rule-2: #C9D2E0;
  --bic: #1D4FB5; --on-bic: #FFFFFF; --bic-soft: #E3EAF8;
  --margin: #E1473C; --gold: #E9B949; --ok: #23845A; --err: #C2362F;
  --ring-s: 60%; --ring-l: 60%; --tint-s: 72%; --tint-l: 93%; --tint-ink: 26%; --who-l: 38%; --line-l: 42%;
  --film: #17140F; --film-ink: #EDE6D6; --dev-0: #100E0B; --dev-1: #3B2A1C; --dev-ink: #E9C46A;
  --scrim: rgba(12, 15, 22, .45);
  --shadow-1: 0 1px 2px rgba(20, 24, 33, .06), 0 4px 14px rgba(20, 24, 33, .06);
  --shadow-2: 0 12px 40px rgba(20, 24, 33, .22);
  --radius: 16px;
  --f-display: "Bricolage Grotesque", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --f-body: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1016; --sheet: #151922; --sheet-2: #1B202A; --desk: #090B0F;
    --ink: #E6E9EF; --ink-2: #A9B1BF; --ink-3: #737C8C;
    --rule: #252B36; --rule-2: #313A49;
    --bic: #84A6FF; --on-bic: #0A1022; --bic-soft: #18233E;
    --margin: #FF6B60; --gold: #E9C46A; --ok: #4CC38A; --err: #FF7A70;
    --ring-s: 55%; --ring-l: 62%; --tint-s: 26%; --tint-l: 18%; --tint-ink: 86%; --who-l: 72%; --line-l: 70%;
    --scrim: rgba(0, 0, 0, .62);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .5); --shadow-2: 0 12px 40px rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1016; --sheet: #151922; --sheet-2: #1B202A; --desk: #090B0F;
  --ink: #E6E9EF; --ink-2: #A9B1BF; --ink-3: #737C8C;
  --rule: #252B36; --rule-2: #313A49;
  --bic: #84A6FF; --on-bic: #0A1022; --bic-soft: #18233E;
  --margin: #FF6B60; --gold: #E9C46A; --ok: #4CC38A; --err: #FF7A70;
  --ring-s: 55%; --ring-l: 62%; --tint-s: 26%; --tint-l: 18%; --tint-ink: 86%; --who-l: 72%; --line-l: 70%;
  --scrim: rgba(0, 0, 0, .62);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5); --shadow-2: 0 12px 40px rgba(0, 0, 0, .65);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
@media (min-width: 640px) { body { background: var(--desk); } }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
a { color: var(--bic); }
:focus-visible { outline: 2px solid var(--bic); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.mono { font-family: var(--f-mono); }
.dim { color: var(--ink-2); }
.small { font-size: 12.5px; }
.pad { padding: 12px 16px; }
.pad-x { padding-left: 16px; padding-right: 16px; }
.end-space { height: 28px; }
.sp { width: 40px; flex: none; }

/* ---------- Coque ---------- */
#app { position: fixed; inset: 0; height: 100vh; height: 100dvh; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); }
@media (min-width: 640px) { #app, .panel { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); } }
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 8px 16px; border-bottom: 1px solid var(--rule); background: var(--paper); min-height: 56px; }
.tb-left { min-width: 0; } .tb-right { display: flex; align-items: center; gap: 2px; }
.wordmark { margin: 0; font: 800 26px/1 var(--f-display); letter-spacing: -.035em; color: var(--ink); }
.wordmark::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 3px; border-radius: 50%; background: var(--gold); vertical-align: 14px; }
.title { margin: 0; font: 700 21px/1.1 var(--f-display); letter-spacing: -.015em; }
#view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 4px 6px calc(env(safe-area-inset-bottom, 0px) + 4px); border-top: 1px solid var(--rule); background: var(--paper); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 5px; border: 0; background: none; color: var(--ink-3); font: 500 10.5px/1 var(--f-body); }
.tab.on { color: var(--bic); }
.tab.create { justify-self: center; width: 50px; height: 40px; border-radius: 14px; background: var(--bic); color: var(--on-bic); display: grid; place-items: center; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--margin); color: #fff; font: 700 10.5px/18px var(--f-body); text-align: center; }
.tab .badge { position: absolute; top: 1px; left: 56%; }

/* ---------- Contrôles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); font: 600 14px/1.15 var(--f-body); text-decoration: none; }
.btn.primary { background: var(--bic); border-color: var(--bic); color: var(--on-bic); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn.danger { color: var(--err); }
.btn.ai { border-style: dashed; color: var(--bic); background: transparent; align-self: flex-start; }
.btn:disabled { opacity: .65; }
.btn.more { display: flex; margin: 6px auto 18px; }
.icon-btn { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; padding: 0; border-radius: 12px; border: 0; background: transparent; color: var(--ink); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; color: var(--ink-2); }
.icon-btn.on { color: var(--bic); }
.icon-btn.on .ic-pin path { fill: currentColor; }
.plain { background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; }
.link { background: none; border: 0; padding: 0; color: var(--bic); font: inherit; font-weight: 600; text-align: left; }
.link.dim { color: var(--ink-3); font-weight: 500; }
.pill { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; background: var(--bic-soft); color: var(--bic); font-size: 11px; letter-spacing: .04em; }
.chips { display: flex; gap: 8px; }
.chips.wrap { flex-wrap: wrap; }
.chips.center { justify-content: center; }
.chips.scroll-x { overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.chips.scroll-x::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); font: 500 13px/1.1 var(--f-body); white-space: nowrap; }
.chip .av { --s: 22px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.ghost { background: transparent; border-style: dashed; color: var(--ink-2); white-space: normal; text-align: left; }
.chip:disabled { opacity: 1; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: var(--sheet-2); border: 1px solid var(--rule); }
.seg button { padding: 7px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font: 600 13px/1.1 var(--f-body); }
.seg button.on { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow-1); }
.tgl { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; cursor: pointer; }
.tgl input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.tgl-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tgl-txt b { font-weight: 600; font-size: 14.5px; }
.tgl-ui { position: relative; flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--rule-2); transition: background .2s; }
.tgl-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.tgl input:checked + .tgl-ui { background: var(--bic); }
.tgl input:checked + .tgl-ui::after { transform: translateX(18px); }
.tgl input:focus-visible + .tgl-ui { outline: 2px solid var(--bic); outline-offset: 2px; }
.lbl { display: block; margin: 6px 0 0; font: 600 12.5px/1.2 var(--f-body); color: var(--ink-2); }
.fld { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.fld > span { font: 600 12.5px/1.25 var(--f-body); color: var(--ink-2); }
.fld em { font-style: normal; font-weight: 500; color: var(--bic); }
input[type="text"], input[type="url"], input[type="password"], select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); font: 400 16px/1.45 var(--f-body); appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { resize: vertical; min-height: 46px; }
textarea.big { min-height: 150px; }
textarea.ruled {
  padding-left: 34px; line-height: 24px;
  background-image: linear-gradient(90deg, transparent 0 22px, color-mix(in srgb, var(--margin) 45%, transparent) 22px 23px, transparent 23px), repeating-linear-gradient(to bottom, transparent 0 23px, var(--rule) 23px 24px);
  background-position: 0 0, 0 11px; background-attachment: local;
}
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input[type="range"] { width: 100%; accent-color: var(--bic); }
.spin { flex: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- Photos en développement ---------- */
.ph { position: relative; display: block; width: 100%; max-width: 100%; overflow: hidden; background: var(--dev-0); isolation: isolate; }
.ph::before { content: ''; position: absolute; inset: -10%; z-index: 0; background: radial-gradient(60% 50% at 32% 30%, var(--dev-1), transparent 70%), radial-gradient(50% 45% at 75% 80%, rgba(233, 196, 106, .18), transparent 70%); animation: develop 3.4s ease-in-out infinite alternate; }
@keyframes develop { from { opacity: .3; filter: blur(14px); transform: scale(1.04); } to { opacity: 1; filter: blur(4px); transform: scale(1); } }
.ph-label { position: absolute; left: 10px; bottom: 9px; z-index: 2; font: 500 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dev-ink); opacity: .9; }
.ph.loading .ph-label::after { content: '…'; }
.ph img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s ease; }
.ph.ready img { opacity: 1; }
.ph.ready::before, .ph.ready .ph-label { display: none; }
.ph.instant img { transition: none; }
.ph.failed { cursor: pointer; }
.ph.failed::before { animation: none; opacity: .45; }
.ph.failed .ph-label { color: #FF9F95; }
.ph.round { border-radius: 50%; }
.ph.contain img { object-fit: contain; }
.ph.empty::before { animation: none; opacity: .5; }

/* ---------- Avatars ---------- */
.av { --s: 40px; --h: 212; position: relative; display: inline-grid; place-items: center; flex: none; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden; background: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) 35% var(--tint-ink)); }
.av.ring { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px hsl(var(--h) var(--ring-s) var(--ring-l)); }
.av.story { box-shadow: 0 0 0 2.5px var(--paper), 0 0 0 5px var(--margin); }
.av.story.seen { box-shadow: 0 0 0 2.5px var(--paper), 0 0 0 4px var(--rule-2); }
.av.me { background: var(--bic-soft); color: var(--bic); }
.av .ph { position: absolute; inset: 0; width: 100%; height: 100%; }
.av .ini { font: 700 calc(var(--s) * .38)/1 var(--f-display); letter-spacing: -.02em; }
.av-stack { position: relative; flex: none; width: 52px; height: 52px; }
.av-stack .av { position: absolute; }
.av-stack .av:first-child { top: 0; left: 0; }
.av-stack .av:last-child { right: 0; bottom: 0; }
.av-stack.sm { width: 40px; height: 40px; }

/* ---------- Fil ---------- */
.tray { display: flex; gap: 12px; overflow-x: auto; padding: 14px 16px 8px; scrollbar-width: none; }
.tray::-webkit-scrollbar { display: none; }
.tray-it { display: flex; flex: none; flex-direction: column; align-items: center; gap: 8px; width: 72px; padding: 5px 0 2px; border: 0; background: none; color: var(--ink-2); font: 500 12px/1.1 var(--f-body); }
.tray-it > span:last-child { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.life { display: flex; flex-direction: column; gap: 6px; padding: 6px 16px 12px; }
.life-btn { width: 100%; padding: 12px; border-radius: 14px; border-color: transparent; background: var(--bic-soft); color: var(--bic); }
.activity { margin: 0; min-height: 1.3em; font: 500 11.5px/1.3 var(--f-mono); color: var(--ink-3); text-align: center; }
.notice { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin: 6px 16px 4px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; }
.notice.warn { background: color-mix(in srgb, var(--gold) 16%, var(--sheet)); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 44px 24px; text-align: center; }
.empty b { font: 700 18px/1.2 var(--f-display); }
.empty p { margin: 0; max-width: 34ch; }
.post { margin: 0 0 12px; background: var(--sheet); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
@media (min-width: 600px) { .post { margin: 0 12px 14px; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; } }
.post-h { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 14px; }
.post-who { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 2px; }
.post-who b, .post-who .name { overflow: hidden; color: var(--ink); font: 600 14.5px/1.2 var(--f-body); white-space: nowrap; text-overflow: ellipsis; }
.post-who .sub { color: var(--ink-3); font-size: 12px; }
.post-media { position: relative; cursor: pointer; }
.burst { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; color: #fff; opacity: 0; pointer-events: none; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .35)); }
.burst path { fill: #fff; stroke: none; }
.post-media.pop .burst { animation: burst .8s ease; }
@keyframes burst { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.12); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.post-actions { display: flex; align-items: center; gap: 2px; padding: 4px 6px 0; }
.like.on { color: var(--margin); }
.like.on path { fill: currentColor; }
.frame { margin-left: auto; padding-right: 10px; color: var(--ink-3); font-size: 11px; letter-spacing: .14em; }
.post-likes, .post-cap, .com { margin: 4px 14px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.post-likes b, .post-cap b, .com b { font-weight: 600; }
.coms-more { display: block; margin: 3px 14px; font-size: 13.5px; }
.typing-line { margin: 6px 14px; color: var(--bic); font: 500 12px/1.3 var(--f-mono); }
.post-reply { display: flex; align-items: center; gap: 10px; width: calc(100% - 28px); margin: 8px 14px 12px; padding: 0; border: 0; background: none; color: var(--ink-3); font-size: 13.5px; }
.post-reply .av { --s: 24px; }
.post-note { margin: 2px 14px 2px; padding: 16px 16px 16px 40px; border-radius: 6px 6px 14px 6px; background-color: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) 30% var(--tint-ink)); background-image: linear-gradient(90deg, transparent 0 26px, color-mix(in srgb, var(--margin) 50%, transparent) 26px 27px, transparent 27px), repeating-linear-gradient(to bottom, transparent 0 25px, hsl(var(--h) 40% var(--line-l) / .22) 25px 26px); background-position: 0 0, 0 15px; font: 500 17px/26px var(--f-body); }
.post-note p { margin: 0; }
.coms { padding: 4px 0 12px; border-top: 1px solid var(--rule); }
.com-full { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; }
.com-full p { margin: 0; min-width: 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.com-t { display: block; margin-top: 3px; color: var(--ink-3); font: 400 11px/1.3 var(--f-mono); }

/* ---------- Listes ---------- */
.list { padding: 6px 0 20px; }
.row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border: 0; background: none; color: inherit; text-align: left; }
.row-main { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 3px; }
.row-main b { font: 600 15px/1.2 var(--f-body); }
.row-main .dim { overflow: hidden; font-size: 13.5px; white-space: nowrap; text-overflow: ellipsis; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.sec-t { margin: 18px 16px 4px; color: var(--ink-3); font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; }
.ghost-row { margin-top: 10px; color: var(--bic); }
.ghost-row .ic { flex: none; width: 48px; }
.typing-txt { color: var(--bic) !important; }
.tag { padding: 3px 6px; border-radius: 6px; background: var(--bic-soft); color: var(--bic); font: 500 9.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; vertical-align: 2px; }
.row.check { cursor: pointer; }
.row.check input { position: absolute; opacity: 0; pointer-events: none; }
.checkmark { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule-2); color: transparent; }
.row.check input:checked ~ .checkmark { background: var(--bic); border-color: var(--bic); color: var(--on-bic); }
.row.check input:focus-visible ~ .checkmark { outline: 2px solid var(--bic); outline-offset: 2px; }

/* ---------- Studio ---------- */
.studio { display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 28px; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--sheet); }
.row2 { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.row2 > div { display: flex; flex-direction: column; gap: 6px; }
.contact, .gallery { padding: 12px; border-radius: var(--radius); background: var(--film); color: var(--film-ink); }
.contact-h { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 2px 10px; }
.contact-h b { font: 700 15px/1.2 var(--f-display); }
.contact-h .dim { color: #B9AF9C; }
.gallery .chips.scroll-x { margin: 0 -12px 8px; padding: 0 12px 4px; }
.gallery .chip { background: transparent; border-color: #4A4336; color: var(--film-ink); }
.gallery .chip.on { background: var(--film-ink); border-color: var(--film-ink); color: var(--film); }
.sheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { position: relative; display: block; padding: 0; overflow: hidden; border: 0; border-radius: 4px; background: #000; }
.tile .ph-label { display: none; }
.tile-n { position: absolute; left: 6px; bottom: 5px; z-index: 3; color: var(--dev-ink); font-size: 9.5px; letter-spacing: .12em; text-shadow: 0 1px 2px #000; }
.gallery .btn.more { background: transparent; border-color: #4A4336; color: var(--film-ink); }

/* ---------- Personnages ---------- */
.cast { display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 28px; }
.me-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--sheet); text-align: left; }
.me-card div { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
.me-card b { font: 700 16px/1.2 var(--f-display); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cast-card { --h: 212; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; min-height: 196px; padding: 16px 14px 14px 24px; overflow: hidden; border: 0; border-radius: 6px 6px 16px 6px; text-align: left; color: hsl(var(--h) 28% var(--tint-ink)); background-color: hsl(var(--h) var(--tint-s) var(--tint-l)); background-image: linear-gradient(90deg, transparent 0 13px, color-mix(in srgb, var(--margin) 55%, transparent) 13px 14px, transparent 14px), repeating-linear-gradient(to bottom, transparent 0 21px, hsl(var(--h) 45% var(--line-l) / .18) 21px 22px); background-position: 0 0, 0 86px; }
.cast-card .av { margin-bottom: 6px; }
.cast-card b { font: 700 16.5px/1.15 var(--f-display); letter-spacing: -.01em; }
.cast-card .handle { opacity: .7; }
.cc-bio { display: -webkit-box; overflow: hidden; font-size: 12.5px; line-height: 1.35; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.mood { display: inline-block; padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--sheet) 70%, transparent); font: 500 11.5px/1.25 var(--f-body); }
.cast-card.new { align-items: center; justify-content: center; gap: 8px; background: var(--sheet); background-image: none; border: 1.5px dashed var(--rule-2); color: var(--ink-2); text-align: center; cursor: pointer; padding: 16px; }
.cast-card.new b { color: var(--ink); font-size: 15px; }

/* ---------- Panneaux ---------- */
.panel { position: fixed; top: var(--vvt, 0px); left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; height: var(--vvh, 100dvh); max-width: 600px; margin: 0 auto; background: var(--paper); opacity: 0; transform: translateX(28px); transition: transform .22s ease, opacity .22s ease; }
.panel.in { opacity: 1; transform: none; }
.panel.out { opacity: 0; transform: translateX(28px); pointer-events: none; }
.p-head { display: flex; flex: none; align-items: center; gap: 6px; min-height: 54px; padding: calc(env(safe-area-inset-top, 0px) + 6px) 6px 6px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.p-title { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 1px; }
.p-title b { overflow: hidden; font: 600 16px/1.2 var(--f-body); white-space: nowrap; text-overflow: ellipsis; }
.p-title[data-act] { cursor: pointer; }
.p-title .dim, .p-title .small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.p-right { display: flex; flex: none; align-items: center; gap: 2px; }
.p-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.p-foot { flex: none; padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px); border-top: 1px solid var(--rule); background: var(--paper); }

/* Feuille d'actions */
.panel.is-sheet { background: transparent; opacity: 1; transform: none; border: 0; }
.scrim { position: absolute; inset: 0; opacity: 0; background: var(--scrim); transition: opacity .2s; }
.panel.is-sheet.in .scrim { opacity: 1; }
.sheet-card { position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 82%; overflow: auto; padding: 14px 8px 8px; border-radius: 20px; background: var(--sheet); box-shadow: var(--shadow-2); transform: translateY(110%); transition: transform .26s cubic-bezier(.2, .9, .3, 1); }
.panel.is-sheet.in .sheet-card { transform: none; }
.panel.is-sheet.out .sheet-card { transform: translateY(110%); }
.panel.is-sheet.out .scrim { opacity: 0; }
.sheet-t { display: block; padding: 4px 12px 8px; font: 700 15.5px/1.25 var(--f-display); }
.sheet-card > .dim { margin: 0 0 8px; padding: 0 12px; font-size: 13.5px; }
.sheet-it { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 12px; border: 0; border-radius: 12px; background: none; color: var(--ink); font: 500 15.5px/1.2 var(--f-body); text-align: left; }
.sheet-it:active { background: var(--sheet-2); }
.sheet-it .ic { color: var(--ink-2); }
.sheet-it.danger, .sheet-it.danger .ic { color: var(--err); }
.sheet-it.cancel { justify-content: center; margin-top: 4px; border-top: 1px solid var(--rule); border-radius: 0 0 12px 12px; font-weight: 600; }

/* Profil */
.profile .cover-wrap { position: relative; }
.cover { aspect-ratio: 5 / 2; }
.cover.band { width: 100%; background-color: hsl(var(--h) var(--tint-s) var(--tint-l)); background-image: repeating-linear-gradient(to bottom, transparent 0 21px, hsl(var(--h) 45% var(--line-l) / .2) 21px 22px); }
.pf-head { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 14px; margin-top: -48px; padding: 0 16px; }
.pf-head .av { box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px hsl(var(--h) var(--ring-s) var(--ring-l)); }
.pf-stats { display: flex; flex: 1; justify-content: space-around; gap: 6px; padding-bottom: 4px; color: var(--ink-2); font-size: 12px; text-align: center; }
.pf-stats span { display: flex; flex-direction: column; gap: 3px; }
.pf-stats b { color: var(--ink); font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.pf-id { padding: 12px 16px 0; }
.pf-id h2 { margin: 0; font: 800 25px/1.1 var(--f-display); letter-spacing: -.025em; }
.pf-facts { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; }
.pf-bio { max-width: 62ch; margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; }
.pf-state { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; }
.pf-state .mood { background: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) 30% var(--tint-ink)); }
.pf-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 16px 4px; }
.pf-actions .btn { padding: 10px 6px; }
.life-row.chips.scroll-x { margin: 0; padding: 10px 16px 8px; }
.life-chip .ic { color: hsl(var(--h) 55% calc(var(--ring-l) - 12%)); }
.pf-tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 2px; overflow-x: auto; padding: 0 10px; border-bottom: 1px solid var(--rule); background: var(--paper); scrollbar-width: none; }
.pf-tabs::-webkit-scrollbar { display: none; }
.pf-tabs button { padding: 13px 10px 11px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink-3); font: 600 13.5px/1 var(--f-body); white-space: nowrap; }
.pf-tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
.pgrid .tile { border-radius: 0; }
.tile.note { display: flex; align-items: flex-start; aspect-ratio: 1 / 1; padding: 8px; background: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) 30% var(--tint-ink)); font-size: 12px; line-height: 1.3; text-align: left; }
.timeline { display: flex; flex-direction: column; gap: 16px; margin: 0; padding: 14px 16px; list-style: none; }
.tl-ev { display: flex; gap: 12px; }
.tl-dot { flex: none; width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; background: hsl(var(--h) var(--ring-s) var(--ring-l)); box-shadow: 0 0 0 4px hsl(var(--h) var(--tint-s) var(--tint-l)); }
.tl-ev p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.5; }
.paper { padding: 12px 16px 14px 38px; border: 1px solid var(--rule); border-radius: 4px 4px 14px 4px; background-color: var(--sheet); background-image: linear-gradient(90deg, transparent 0 24px, color-mix(in srgb, var(--margin) 55%, transparent) 24px 25px, transparent 25px), repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px); background-position: 0 0, 0 33px; box-shadow: var(--shadow-1); }
.paper p { margin: 6px 0 0; font: 500 21px/28px var(--f-hand); color: var(--ink); overflow-wrap: anywhere; }
.paper-d { color: var(--ink-3); }
.big-paper { margin: 16px 0; }
.big-paper p { font: 400 15px/28px var(--f-body); }
.mem-add { display: flex; gap: 8px; padding: 14px 16px 0; }
.mem-add input { flex: 1; min-width: 0; }
.mems { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0 16px 14px; list-style: none; }
.mems li { position: relative; padding: 12px 82px 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet); }
.mems li.pinned { border-color: transparent; background: hsl(var(--h) var(--tint-s) var(--tint-l)); }
.mems p { margin: 0 0 4px; font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
.mem-act { position: absolute; top: 6px; right: 6px; display: flex; }
.rel { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border: 0; background: none; color: inherit; text-align: left; }
.rel div { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
.bristol { margin: 12px 16px; padding: 14px 16px 10px 34px; border-radius: 6px 6px 14px 6px; color: hsl(var(--h) 30% var(--tint-ink)); background-color: hsl(var(--h) var(--tint-s) var(--tint-l)); background-image: linear-gradient(90deg, transparent 0 20px, color-mix(in srgb, var(--margin) 55%, transparent) 20px 21px, transparent 21px); }
.bristol h4 { margin: 0 0 6px; padding-bottom: 8px; border-bottom: 2px solid color-mix(in srgb, var(--bic) 70%, transparent); font: 700 15px/1.2 var(--f-display); letter-spacing: -.01em; }
.f-row { padding: 7px 0; border-bottom: 1px solid hsl(var(--h) 40% var(--line-l) / .2); }
.f-row:last-child { border-bottom: 0; }
.f-k { display: block; font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.f-v { margin: 3px 0 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meter { display: grid; grid-template-columns: 104px minmax(0, 1fr) 26px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.meter i { position: relative; height: 6px; overflow: hidden; border-radius: 3px; background: hsl(var(--h) 40% var(--line-l) / .2); }
.meter i::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: var(--v); border-radius: 3px; background: hsl(var(--h) var(--ring-s) calc(var(--ring-l) - 8%)); }
.meter .mono { font-variant-numeric: tabular-nums; text-align: right; }

/* Éditeur */
.editor { padding-bottom: 20px; }
.editor > .dim.pad-x { padding-top: 12px; padding-bottom: 4px; }
.idea { display: flex; flex-direction: column; gap: 8px; margin: 12px 16px 6px; padding: 14px; border-radius: var(--radius); background: var(--bic-soft); }
.idea .lbl { margin: 0; color: var(--bic); }
.idea p { margin: 0; }
.ed-sec { border-bottom: 1px solid var(--rule); }
.ed-sec summary { display: flex; align-items: center; gap: 10px; padding: 15px 16px; cursor: pointer; list-style: none; }
.ed-sec summary::-webkit-details-marker { display: none; }
.ed-sec summary b { flex: 1; font: 600 15px/1.2 var(--f-body); }
.ed-sec summary .dim { font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }

const TAG_RE = /\[\s*(PHOTO|SELFIE|SOUVENIR|HUMEUR|FAIT)\s*:\s*([^\]]+)\]/gi;
function stripSpeaker(txt, names) {
  let t = txt;
  for (const n of names) {

    t = t.replace(new RegExp(`^\\s*(?:\\*\\*)?(?:${full}|${fn})(?:\\*\\*)?\\s*(?:\\(toi\\))?\\s*[:：]\\s*`, 'gim'), '');
  }

}
function parseReply(text, c, mode, groupMembers) {
  let t = String(text || '').replace(/\r/g, '').trim();
  if (groupMembers) {
    const others = groupMembers.filter((m) => m.id !== c.id).map((m) => firstName(m.name)).concat([userName()]);
    const re = new RegExp(`^\\s*(?:\\*\\*)?(?:${others.map(escapeRe).join('|')})(?:\\*\\*)?\\s*[:：]`, 'im');
    const mm = re.exec(t); if (mm && mm.index > 0) t = t.slice(0, mm.index).trim();
  }
  const items = [], memories = [], facts = []; let mood = null;
  const segs = []; let last = 0, m; TAG_RE.lastIndex = 0;
  while ((m = TAG_RE.exec(t))) {
    segs.push({ type: 'text', text: t.slice(last, m.index) });
    const kind = m[1].toUpperCase(), val = m[2].trim();
    if (kind === 'PHOTO' || kind === 'SELFIE') segs.push({ type: 'photo', prompt: val, selfie: kind === 'SELFIE' });
    else if (kind === 'SOUVENIR') memories.push(val);
    else if (kind === 'HUMEUR') mood = val;
    else if (kind === 'FAIT') facts.push(val);
    last = TAG_RE.lastIndex;
  }
  segs.push({ type: 'text', text: t.slice(last) });
  for (const s of segs) {
    if (s.type === 'photo') { items.push(s); continue; }
    let txt = stripSpeaker(s.text, [c.name]);
    if (mode === 'sms' || mode === 'group') txt = txt.replace(/(^|\s)\*[^*\n]{1,140}\*(?=\s|$)/g, '$1').replace(/[ \t]{2,}/g, ' ');

  }
  return { items, memories, facts, mood };
}

async function readPngCard(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const sig = [137, 80, 78, 71, 13, 10, 26, 10]; for (let i = 0; i < 8; i++) if (buf[i] !== sig[i]) return null;
  let p = 8; const dv = new DataView(buf.buffer);
  while (p + 8 < buf.length) {
    const len = dv.getUint32(p); const type = String.fromCharCode(buf[p + 4], buf[p + 5], buf[p + 6], buf[p + 7]);
    if (type === 'tEXt') {
      const data = buf.slice(p + 8, p + 8 + len); const z = data.indexOf(0);
      const kw = new TextDecoder().decode(data.slice(0, z));
      if (kw === 'chara' || kw === 'ccv3') {
        const b64 = new TextDecoder().decode(data.slice(z + 1));
        const bin = atob(b64); const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
        try { return JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { return null; }
      }
    }
    p += 12 + len;
  }
  return null;
}

const SHEET_TYPES = new Set(['sheet']);
function openPanel(type, params = {}) {
  const p = Object.assign({ pid: uid('pn'), type }, params);
  UI.stack.push(p); p.hist = false;
  if (UI.backPending > 0) UI.pushQueue.push(p); else histPush(p);
  const el = document.createElement('section');
  el.className = `panel panel-${type}${SHEET_TYPES.has(type) ? ' is-sheet' : ''}`;
  el.dataset.pid = p.pid; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  $('#panels').appendChild(el);
  renderPanel(p);
  requestAnimationFrame(() => el.classList.add('in'));
  if (MOUNT[type]) MOUNT[type](p, el);
  return p;
}
function renderPanel(p) {
  const el = panelEl(p); if (!el) return;
  const body = el.querySelector('.p-body'); const st = body ? body.scrollTop : 0;
  const html = PANELS[p.type](p); if (html == null) return;
  el.innerHTML = html;
  const nb = el.querySelector('.p-body'); if (nb) nb.scrollTop = st;
  hydrate(el);
}
function panelEl(p) { return p ? document.querySelector(`.panel[data-pid="${p.pid}"]`) : null; }
function topPanel() { return UI.stack[UI.stack.length - 1] || null; }
function popPanel() {
  const p = UI.stack.pop(); if (!p) return;
  const el = panelEl(p); if (UNMOUNT[p.type]) UNMOUNT[p.type](p);
  if (el) { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => el.remove(), 200); }
  if (p.resolve) p.resolve(p.result ?? false);
}
function closePanel(p = topPanel()) {
  if (!p) return; const idx = UI.stack.indexOf(p); if (idx < 0) return;
  const closing = UI.stack.slice(idx); const k = closing.filter((x) => x.hist).length;
  UI.pushQueue = UI.pushQueue.filter((x) => !closing.includes(x));
  for (let i = 0; i < closing.length; i++) popPanel();
  if (k) {
    // On remonte l'historique et on attend la confirmation avant toute nouvelle entrée,
    // sinon un panneau ouvert dans la foulée désynchronise le bouton retour.
    UI.ignorePop++; UI.backPending++;
    clearTimeout(UI.backTimer); UI.backTimer = setTimeout(() => { if (UI.backPending > 0) { UI.backPending = 0; UI.ignorePop = 0; flushPushes(); } }, 1500);
    try { history.go(-k); } catch (e) { UI.ignorePop--; UI.backPending--; flushPushes(); }
  }
  if (UI.tab === 'messages' || UI.tab === 'feed') { renderTabbar(); refreshView(); }
}
function histPush(p) { try { history.pushState({ depth: UI.stack.indexOf(p) + 1 }, ''); p.hist = true; } catch (e) { p.hist = false; } }
function flushPushes() { if (UI.backPending > 0) return; const q = UI.pushQueue; UI.pushQueue = []; for (const p of q) if (UI.stack.includes(p) && !p.hist) histPush(p); }
window.addEventListener('popstate', (e) => {
  if (UI.ignorePop > 0) { UI.ignorePop--; UI.backPending = Math.max(0, UI.backPending - 1); if (!UI.backPending) clearTimeout(UI.backTimer); flushPushes(); return; }
  const depth = (e.state && e.state.depth) || 0;
  let popped = false;
  while (UI.stack.length > depth) { popPanel(); popped = true; }
  if (popped) { renderTabbar(); refreshView(); }
});
function panelHead(title, { back = true, right = '', sub = '' } = {}) {

}
function sheet({ title = '', text = '', items = [], cancel = 'Annuler' }) {

}

function storyGroups() {
  const cutoff = Date.now() - 24 * 3600e3; const by = new Map();
  for (const s of S.stories) {
    if (s.ts < cutoff) continue; const c = char(s.authorId); if (!c) continue;
    if (!by.has(c.id)) by.set(c.id, { c, items: [] }); by.get(c.id).items.push(s);
  }
  const arr = Array.from(by.values());
  for (const gr of arr) { gr.items.sort((a, b) => a.ts - b.ts); gr.seen = gr.items.every((s) => S.seenStories[s.id]); }
  arr.sort((a, b) => (a.seen - b.seen) || (b.items[b.items.length - 1].ts - a.items[a.items.length - 1].ts));
  return arr;
}

    if (ph && ph.classList.contains('ready') && !typing) p.prog += (now - last) / 6000;
    last = now;
